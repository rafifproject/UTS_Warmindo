<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <!-- Glowing circle background -->
  <circle cx="70" cy="70" r="62" fill="url(#aiGlow)"/>
  <defs>
    <linearGradient id="aiGlow" x1="20" y1="20" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5" stop-opacity="0.15"/>
      <stop stop-color="#06B6D4" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="botBody" x1="45" y1="35" x2="95" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="botScreen" x1="50" y1="45" x2="90" y2="75" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E1B4B"/>
      <stop stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Antenna -->
  <line x1="70" y1="35" x2="70" y2="22" stroke="#818CF8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="70" cy="20" r="5" fill="#38BDF8"/>
  <!-- Head / Body -->
  <rect x="42" y="35" width="56" height="48" rx="16" fill="url(#botBody)"/>
  <!-- Screen face -->
  <rect x="48" y="42" width="44" height="34" rx="10" fill="url(#botScreen)"/>
  <!-- Glowing Eyes -->
  <circle cx="60" cy="58" r="4.5" fill="#38BDF8"/>
  <circle cx="80" cy="58" r="4.5" fill="#38BDF8"/>
  <circle cx="61.5" cy="56.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="81.5" cy="56.5" r="1.5" fill="#FFFFFF"/>
  <!-- Smile -->
  <path d="M66 67C68 69 72 69 74 67" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <!-- Ears / Headset -->
  <rect x="36" y="48" width="6" height="18" rx="3" fill="#818CF8"/>
  <rect x="98" y="48" width="6" height="18" rx="3" fill="#818CF8"/>
  <!-- Floating hands -->
  <circle cx="34" cy="74" r="6" fill="#818CF8"/>
  <circle cx="106" cy="74" r="6" fill="#818CF8"/>
  <!-- Floating body base -->
  <path d="M52 86C52 86 58 98 70 98C82 98 88 86 88 86" fill="url(#botBody)"/>
</svg>
